[metadata]
name = "Catppuccin Frappé"
description = "Soothing pastel theme for resterm (Frappé flavour)"
author = "Peter Merikan"
version = "1.0.0"
tags = ["dark", "catppuccin", "frappe", "pastel"]

[styles.header_title]
foreground = "#8caaee"
bold = true

[styles.header_value]
foreground = "#c6d0f5"

[styles.header_separator]
foreground = "#85c1dc"

[styles.browser_border]
border_color = "#51576d"

[styles.command_bar]
foreground = "#c6d0f5"
background = "#292c3c"

[styles.command_bar_hint]
foreground = "#a6d189"
bold = true

[styles.status_bar]
foreground = "#c6d0f5"
background = "#232634"

[styles.status_bar_info]
foreground = "#b5bfe2"

[styles.status_bar_key]
foreground = "#ef9f76"
bold = true

[styles.status_bar_value]
foreground = "#a5adce"

[status_bar]
base = "#303446"

[status_bar.info]
foreground = "#303446"
background = "#8caaee"

[status_bar.warn]
foreground = "#303446"
background = "#e5c890"

[status_bar.error]
foreground = "#303446"
background = "#e78284"

[status_bar.success]
foreground = "#303446"
background = "#a6d189"

[status_bar.tests_pass]
foreground = "#303446"
background = "#81c8be"

[status_bar.tests_fail]
foreground = "#303446"
background = "#ea999c"

[status_bar.tests_error]
foreground = "#303446"
background = "#ca9ee6"

[status_bar.file]
foreground = "#c6d0f5"
background = "#51576d"

[status_bar.focus]
foreground = "#c6d0f5"
background = "#626880"

[status_bar.mode]
foreground = "#c6d0f5"
background = "#737994"

[status_bar.zoom]
foreground = "#303446"
background = "#99d1db"

[status_bar.minimized]
foreground = "#303446"
background = "#a6d189"

[status_bar.version]
foreground = "#c6d0f5"
background = "#414559"

[status_bar.user]
foreground = "#c6d0f5"
background = "#51576d"

[status_bar.host]
foreground = "#b5bfe2"
background = "#292c3c"

[styles.tab_active]
background = "#8caaee"
foreground = "#303446"

[styles.tab_inactive]
foreground = "#838ba7"

[styles.notification]
background = "#292c3c"
foreground = "#c6d0f5"

[styles.error]
background = "#e78284"
foreground = "#303446"

[styles.success]
background = "#a6d189"
