[metadata]
name = "Catppuccin Latte"
description = "Soothing pastel theme for resterm (Latte flavour)"
author = "Peter Merikan"
version = "1.0.0"
tags = ["light", "catppuccin", "latte", "pastel"]

[styles.header_title]
foreground = "#1e66f5"
bold = true

[styles.header_value]
foreground = "#4c4f69"

[styles.header_separator]
foreground = "#209fb5"

[styles.browser_border]
border_color = "#bcc0cc"

[styles.command_bar]
foreground = "#4c4f69"
background = "#e6e9ef"

[styles.command_bar_hint]
foreground = "#40a02b"
bold = true

[styles.status_bar]
foreground = "#4c4f69"
background = "#dce0e8"

[styles.status_bar_info]
foreground = "#5c5f77"

[styles.status_bar_key]
foreground = "#fe640b"
bold = true

[styles.status_bar_value]
foreground = "#6c6f85"

[status_bar]
base = "#eff1f5"

[status_bar.info]
foreground = "#eff1f5"
background = "#1e66f5"

[status_bar.warn]
foreground = "#eff1f5"
background = "#df8e1d"

[status_bar.error]
foreground = "#eff1f5"
background = "#d20f39"

[status_bar.success]
foreground = "#eff1f5"
background = "#40a02b"

[status_bar.tests_pass]
foreground = "#eff1f5"
background = "#179299"

[status_bar.tests_fail]
foreground = "#eff1f5"
background = "#e64553"

[status_bar.tests_error]
foreground = "#eff1f5"
background = "#8839ef"

[status_bar.file]
foreground = "#4c4f69"
background = "#bcc0cc"

[status_bar.focus]
foreground = "#4c4f69"
background = "#acb0be"

[status_bar.mode]
foreground = "#4c4f69"
background = "#9ca0b0"

[status_bar.zoom]
foreground = "#eff1f5"
background = "#04a5e5"

[status_bar.minimized]
foreground = "#eff1f5"
background = "#40a02b"

[status_bar.version]
foreground = "#4c4f69"
background = "#ccd0da"

[status_bar.user]
foreground = "#4c4f69"
background = "#bcc0cc"

[status_bar.host]
foreground = "#5c5f77"
background = "#e6e9ef"

[styles.tab_active]
background = "#1e66f5"
foreground = "#eff1f5"

[styles.tab_inactive]
foreground = "#8c8fa1"

[styles.notification]
background = "#e6e9ef"
foreground = "#4c4f69"

[styles.error]
background = "#d20f39"
foreground = "#eff1f5"

[styles.success]
background = "#40a02b"
foreground = "#eff1f5"

[styles.list_item_title]
foreground = "#4c4f69"

[styles.list_item_description]
foreground = "#1e66f5"

[styles.list_item_selected_title]
foreground = "#eff1f5"
background = "#1e66f5"
bold = false

[styles.list_item_selected_description]
foreground = "#eff1f5"
background = "#179299"

[styles.list_item_dimmed_title]
foreground = "#8c8fa1"

[styles.list_item_dimmed_description]
foreground = "#9ca0b0"

[styles.list_item_filter_match]
foreground = "#fe640b"
underline = true

[styles.response_content]
foreground = "#40a02b"

[styles.response_content_raw]
foreground = "#179299"

[styles.response_content_headers]
foreground = "#1e66f5"

[styles.response_selection]
background = "#ccd0da"

[styles.response_cursor]
foreground = "#df8e1d"
bold = true

[colors]
pane_border_focus_file = "#1e66f5"
pane_border_focus_requests = "#40a02b"
pane_active_foreground = "#4c4f69"
modal_backdrop = "#dce0e8"
modal_input_background = "#eff1f5"
