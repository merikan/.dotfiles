request_line = "#df8e1d"
request_separator = "#1e66f5"

[editor_metadata.directive_colors]
graphql = "#8839ef"
workflow = "#40a02b"
custom = "#8c8fa1"

[[header_segments]]
background = "#1e66f5"
foreground = "#eff1f5"
border = "#1e66f5"
accent = "#4c4f69"

[[header_segments]]
background = "#df8e1d"
foreground = "#eff1f5"
border = "#1e66f5"

[[command_segments]]
