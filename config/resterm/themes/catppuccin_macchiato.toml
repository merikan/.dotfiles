[metadata]
name = "Catppuccin Macchiato"
description = "Soothing pastel theme for resterm (Macchiato flavour)"
author = "Peter Merikan"
version = "1.0.0"
tags = ["dark", "catppuccin", "macchiato", "pastel"]

[styles.header_title]
foreground = "#8aadf4"
bold = true

[styles.header_value]
foreground = "#cad3f5"

[styles.header_separator]
foreground = "#7dc4e4"

[styles.browser_border]
border_color = "#494d64"

[styles.command_bar]
foreground = "#cad3f5"
background = "#1e2030"

[styles.command_bar_hint]
foreground = "#a6da95"
bold = true

[styles.status_bar]
foreground = "#cad3f5"
background = "#181926"

[styles.status_bar_info]
foreground = "#b8c0e0"

[styles.status_bar_key]
foreground = "#f5a97f"
bold = true

[styles.status_bar_value]
foreground = "#a5adcb"

[status_bar]
base = "#24273a"

[status_bar.info]
foreground = "#24273a"
background = "#8aadf4"

[status_bar.warn]
foreground = "#24273a"
background = "#eed49f"

[status_bar.error]
foreground = "#24273a"
background = "#ed8796"

[status_bar.success]
foreground = "#24273a"
background = "#a6da95"

[status_bar.tests_pass]
foreground = "#24273a"
