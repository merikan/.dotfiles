[status_bar.tests_fail]
foreground = "#24273a"
background = "#ee99a0"

[status_bar.tests_error]
foreground = "#24273a"
background = "#c6a0f6"

[status_bar.file]
foreground = "#cad3f5"
background = "#494d64"

[status_bar.focus]
foreground = "#cad3f5"
background = "#5b6078"

[status_bar.mode]
foreground = "#cad3f5"
background = "#6e738d"

[status_bar.zoom]
foreground = "#24273a"
background = "#91d7e3"

[status_bar.minimized]
foreground = "#24273a"
background = "#a6da95"

[status_bar.version]
foreground = "#cad3f5"
background = "#363a4f"

[status_bar.user]
foreground = "#cad3f5"
background = "#494d64"

[status_bar.host]
foreground = "#b8c0e0"
background = "#1e2030"

[styles.tab_active]
background = "#8aadf4"
foreground = "#24273a"

[styles.tab_inactive]
foreground = "#8087a2"

[styles.notification]
background = "#1e2030"
